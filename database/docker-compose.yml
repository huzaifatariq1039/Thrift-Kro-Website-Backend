version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: thriftkro_postgres
    restart: always
    environment:
      POSTGRES_DB: thriftkro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thriftkro"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: thriftkro_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@thriftkro.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
